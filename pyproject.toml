[project]
name = "card-ocr"
version = "0.1.0"
description = "Digitize handwritten card photos into JSON decks"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.7",
    "torchvision",
    "transformers>=4.57",
    "accelerate",
    "bitsandbytes",
    "pillow",
    "pillow-heif",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
